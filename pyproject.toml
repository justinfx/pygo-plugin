[build-system]
# grpcio-tools is build-time-only (used by the custom grpc command in
# setup.py to generate code, not runtime, so it belongs here rather than
# in [project.dependencies]). The go_build command needs only the Go
# toolchain, not a Python build-time tool.
requires = ["setuptools>=64", "wheel", "grpcio-tools"]
build-backend = "setuptools.build_meta"

[project]
name = "pygo-plugin"
version = "0.0.1"
description = "Python gRPC Plugin System (port of hashicorp/go-plugin)"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Justin Israel", email = "justinisrael@gmail.com"}]
requires-python = ">=3.9"
keywords = ["python", "rpc", "plugin", "grpc", "grpcio", "go-plugin", "hashicorp"]
classifiers = [
    "Development Status :: 4 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Runtime-only: see setup.py's GrpcGenTool for the separate build-time
# tool (grpcio-tools), declared above instead. cffi is runtime (not
# build-time): it's how pygo_plugin._native loads the compiled go_plugin
# shared library.
dependencies = [
    "cffi",
    "grpcio",
    "grpcio-health-checking",
    "grpcio-reflection",
    "protobuf",
    "rpyc",
]

[project.urls]
Homepage = "https://github.com/justinfx/pygo-plugin"

[project.optional-dependencies]
# grpcio-tools is also declared under [build-system] requires (for a plain
# `pip install .`, which builds in an isolated env); repeated here because
# --no-build-isolation skips that env, see AGENTS.md's "Build pipeline"
# section for why it must be present in the active venv in that case.
test = ["pytest", "grpcio-tools"]

[tool.setuptools]
zip-safe = false
packages = ["pygo_plugin", "pygo_plugin._goplugin", "pygo_plugin.proto", "pygo_plugin.pyinterp"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"pygo_plugin._goplugin" = ["*.so", "*.dylib", "*.dll"]
"pygo_plugin.proto" = ["*.py", "*.proto", "*.go-plugin"]
